name: bhai-garage

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bhai_garage}
      POSTGRES_USER: ${POSTGRES_USER:-bhai_garage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: postgres://${POSTGRES_USER:-bhai_garage}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bhai_garage}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      BHAI_SETUP_TOKEN: ${BHAI_SETUP_TOKEN:?Set BHAI_SETUP_TOKEN in .env}
      BHAI_PROVISIONER: ${BHAI_PROVISIONER:-simulation}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5000"
    ports:
      - "127.0.0.1:${BHAI_API_LOCAL_PORT:-5000}:5000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 4s
      retries: 12

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BHAI_WEB_PORT:-8080}:80"

  host-agent:
    profiles: ["libvirt"]
    build:
      context: .
      dockerfile: Dockerfile.host-agent
    restart: unless-stopped
    user: "${BHAI_AGENT_UID:-1000}:${BHAI_AGENT_GID:-1000}"
    group_add:
      - "${LIBVIRT_GID:-106}"
      - "${BHAI_QEMU_GID:?Set BHAI_QEMU_GID to the numeric GID of the host libvirt-qemu group}"
    environment:
      BHAI_API_URL: http://127.0.0.1:${BHAI_API_LOCAL_PORT:-5000}/api
      BHAI_AGENT_TOKEN: ${BHAI_AGENT_TOKEN:-}
      BHAI_QEMU_GID: ${BHAI_QEMU_GID:?Set BHAI_QEMU_GID to the numeric GID of the host libvirt-qemu group}
      BHAI_IMAGES_JSON: "${BHAI_IMAGES_JSON:-}"
      BHAI_IMAGE_DIRECTORY: ${BHAI_IMAGE_DIR:-/var/lib/libvirt/images/bhai-garage-base}
      BHAI_VM_STORAGE: ${BHAI_VM_DIR:-/var/lib/libvirt/images/bhai-garage-vms}
      BHAI_LIBVIRT_NETWORK: ${BHAI_LIBVIRT_NETWORK:-default}
      BHAI_LIBVIRT_BRIDGE: ${BHAI_LIBVIRT_BRIDGE:-}
      BHAI_HOSTNAME: ${BHAI_HOSTNAME:-}
    volumes:
      - /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock
      - ${BHAI_IMAGE_DIR:-/var/lib/libvirt/images/bhai-garage-base}:${BHAI_IMAGE_DIR:-/var/lib/libvirt/images/bhai-garage-base}:ro
      - ${BHAI_VM_DIR:-/var/lib/libvirt/images/bhai-garage-vms}:${BHAI_VM_DIR:-/var/lib/libvirt/images/bhai-garage-vms}
    network_mode: host
    depends_on:
      api:
        condition: service_healthy

  caddy:
    profiles: ["public"]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      BHAI_DOMAIN: ${BHAI_DOMAIN:-}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ -z "$BHAI_DOMAIN" ]; then
          echo "Set BHAI_DOMAIN to a real public DNS hostname before enabling the public profile." >&2
          exit 2
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
