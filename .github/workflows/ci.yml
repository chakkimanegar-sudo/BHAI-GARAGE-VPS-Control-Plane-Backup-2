name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build workspace
        env:
          PORT: "5000"
          BASE_PATH: "/"
        run: pnpm run build

      - name: Test host agent
        run: pnpm --filter @workspace/host-agent run test

      - name: Test API server recovery logic
        run: pnpm --filter @workspace/api-server run test
