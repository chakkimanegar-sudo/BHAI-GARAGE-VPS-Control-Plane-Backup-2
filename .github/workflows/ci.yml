name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://bhai_garage:ci_test_password@localhost:5432/bhai_garage
      SESSION_SECRET: bhai-garage-ci-session-secret-not-for-production-0123456789
      BHAI_SETUP_TOKEN: bhai-garage-ci-setup-token-not-for-production-0123456789
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bhai_garage
          POSTGRES_USER: bhai_garage
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bhai_garage -d bhai_garage"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build workspace
        env:
          PORT: "5000"
          BASE_PATH: "/"
        run: pnpm run build

      - name: Validate Docker Compose deployment configuration
        env:
          POSTGRES_PASSWORD: ci_compose_pw_741c2bda9034e8fb
          SESSION_SECRET: ci-compose-session-secret-741c2bda9034e8fb
          BHAI_SETUP_TOKEN: ci-compose-setup-token-d8203af17c64ab95
          BHAI_AGENT_TOKEN: ci-compose-agent-token-2371fa904cb685de
          BHAI_QEMU_GID: "640"
          BHAI_IMAGE_DIR: /var/lib/libvirt/images/ci-bhai-garage-images
          BHAI_VM_DIR: /var/lib/libvirt/images/ci-bhai-garage-vms
          BHAI_DOMAIN: garage-ci.example.test
        run: |
          docker compose --profile libvirt --profile public config --quiet
          docker compose --profile libvirt --profile public config --format json > "$RUNNER_TEMP/bhai-garage-compose.json"
          env -u BHAI_DOMAIN docker compose config --quiet
          docker run --rm -e BHAI_DOMAIN=garage-ci.example.test -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          node - "$RUNNER_TEMP/bhai-garage-compose.json" <<'NODE'
          const fs = require("node:fs");
          const config = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          for (const service of ["api", "web"]) {
            const ports = config.services?.[service]?.ports ?? [];
            if (ports.length === 0 || ports.some((port) => port.host_ip !== "127.0.0.1")) {
              throw new Error(`${service} published ports must bind only to 127.0.0.1`);
            }
          }
          if ((config.services?.db?.ports ?? []).length > 0) {
            throw new Error("PostgreSQL must not publish a host port");
          }
          const edge = config.services?.caddy;
          const edgePorts = edge?.ports ?? [];
          for (const [published, target, protocol] of [["80", 80, "tcp"], ["443", 443, "tcp"], ["443", 443, "udp"]]) {
            if (!edgePorts.some((port) => String(port.published) === published && port.target === target && port.protocol === protocol)) {
              throw new Error("Public Caddy edge is missing required HTTP/HTTPS port " + published + "/" + protocol);
            }
          }
          const agent = config.services?.["host-agent"];
          const volumes = agent?.volumes ?? [];
          const mountTargets = volumes.map((volume) => typeof volume === "string"
            ? volume.split(":")[1]
            : volume.target);
          if (agent?.environment?.BHAI_IMAGE_DIRECTORY !== process.env.BHAI_IMAGE_DIR ||
              !mountTargets.includes(process.env.BHAI_IMAGE_DIR)) {
            throw new Error("Host-agent image path mismatch: " + JSON.stringify({expected: process.env.BHAI_IMAGE_DIR, configured: agent?.environment?.BHAI_IMAGE_DIRECTORY, mountTargets, volumes}));
          }
          if (agent?.environment?.BHAI_VM_STORAGE !== process.env.BHAI_VM_DIR ||
              !mountTargets.includes(process.env.BHAI_VM_DIR)) {
            throw new Error("Host-agent VM path mismatch: " + JSON.stringify({expected: process.env.BHAI_VM_DIR, configured: agent?.environment?.BHAI_VM_STORAGE, mountTargets, volumes}));
          }
          const supplementalGroups = (agent?.group_add ?? []).map(String);
          if (agent?.environment?.BHAI_QEMU_GID !== process.env.BHAI_QEMU_GID ||
              !supplementalGroups.includes(process.env.BHAI_QEMU_GID)) {
            throw new Error("Host-agent must receive the configured QEMU GID as an environment value and supplementary group");
          }
          console.log("Web/API are loopback-only; PostgreSQL is private; KVM image/VM mounts and QEMU group agree.");
          NODE

      - name: Build API, web, and host-agent container images
        env:
          POSTGRES_PASSWORD: ci_compose_pw_741c2bda9034e8fb
          SESSION_SECRET: ci-compose-session-secret-741c2bda9034e8fb
          BHAI_SETUP_TOKEN: ci-compose-setup-token-d8203af17c64ab95
          BHAI_AGENT_TOKEN: ci-compose-agent-token-2371fa904cb685de
          BHAI_QEMU_GID: "640"
        run: docker compose build api web host-agent

      - name: Smoke test the complete Docker Compose stack
        env:
          POSTGRES_PASSWORD: ci_compose_pw_741c2bda9034e8fb
          SESSION_SECRET: ci-compose-session-secret-741c2bda9034e8fb
          BHAI_SETUP_TOKEN: ci-compose-setup-token-d8203af17c64ab95
          BHAI_AGENT_TOKEN: ci-compose-agent-token-2371fa904cb685de
          BHAI_QEMU_GID: "640"
        run: |
          set -Eeuo pipefail
          trap 'docker compose down --volumes --remove-orphans' EXIT
          docker compose up -d db
          db_ready=0
          for attempt in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U bhai_garage -d bhai_garage >/dev/null 2>&1; then
              db_ready=1
              break
            fi
            sleep 2
          done
          if [[ "$db_ready" != "1" ]]; then
            docker compose ps
            docker compose logs --no-color db
            exit 1
          fi
          docker compose run --no-deps --rm api ./lib/db/node_modules/.bin/drizzle-kit push --config ./lib/db/drizzle.config.ts
          docker compose up -d --no-build api web

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz -o /dev/null &&
               curl --fail --silent http://127.0.0.1:8080/readyz -o /dev/null &&
               curl --fail --silent http://127.0.0.1:8080/ -o /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done

          if [[ "$ready" != "1" ]]; then
            docker compose ps
            docker compose logs --no-color db api web
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:8080/healthz
          curl --fail --silent --show-error http://127.0.0.1:8080/readyz
          # Same-origin POST must survive the reverse proxy with Host's port intact.
          curl --fail --silent --show-error -X POST -H 'Origin: http://127.0.0.1:8080' -H 'sec-fetch-site: same-origin' http://127.0.0.1:8080/api/auth/logout -o /dev/null
          echo "Compose web, API readiness, and reverse-proxy same-origin POST checks passed."

      - name: Check backup script syntax
        run: bash -n scripts/backup-db.sh scripts/restore-db.sh scripts/test-db-backup.sh scripts/prepare-kvm-host.sh scripts/test-prepare-kvm-host.sh scripts/smoke-test-kvm-host.sh scripts/backup-vps-disks.sh scripts/test-vps-disk-backup.sh scripts/restore-vps-disk-backup.sh scripts/test-vps-disk-restore.sh scripts/test-kvm-smoke-lifecycle.sh

      - name: Test backup rotation and restore safety
        run: bash scripts/test-db-backup.sh

      - name: Test offline VPS disk backup safety
        run: bash scripts/test-vps-disk-backup.sh

      - name: Test verified VPS disk restore safety
        run: sudo bash scripts/test-vps-disk-restore.sh

      - name: Test KVM host preparation and preflight
        run: bash scripts/test-prepare-kvm-host.sh

      - name: Validate opt-in live KVM smoke-test CLI
        env:
          BHAI_QEMU_GID: "640"
        run: bash scripts/smoke-test-kvm-host.sh --help

      - name: Test KVM smoke-test lifecycle with isolated command fakes
        run: sudo bash scripts/test-kvm-smoke-lifecycle.sh

      - name: Test host agent
        run: pnpm --filter @workspace/host-agent run test

      - name: Apply database schema to test database
        run: pnpm --filter @workspace/db run push

      - name: Test API server recovery logic
        run: pnpm --filter @workspace/api-server run test
