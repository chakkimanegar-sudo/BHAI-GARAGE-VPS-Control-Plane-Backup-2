name: KVM live guest smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/kvm-live-smoke.yml"
      - "scripts/prepare-kvm-host.sh"
      - "scripts/smoke-test-kvm-host.sh"
      - "scripts/smoke-test-host-agent-kvm.mjs"
      - "packages/host-agent/src/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-guest-smoke:
    name: Probe KVM and run a real Ubuntu guest when available
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Probe runner hardware virtualization
        id: kvm
        shell: bash
        run: |
          if [[ -e /dev/kvm ]] && grep -Eiq '(^|[[:space:]])(vmx|svm)([[:space:]]|$)' /proc/cpuinfo; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "KVM device and CPU virtualization flags are exposed."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::This hosted runner does not expose KVM; a real guest boot cannot be tested in this run."
            [[ -e /dev/kvm ]] || echo "Missing /dev/kvm"
            grep -Eio 'vmx|svm' /proc/cpuinfo | sort -u || true
          fi

      - name: Install and prepare KVM host
        if: steps.kvm.outputs.available == 'true'
        run: sudo env BHAI_AGENT_UID="$(id -u runner)" BHAI_AGENT_GID="$(id -g runner)" bash scripts/prepare-kvm-host.sh --install

      - name: Boot, verify, restart and remove a real Ubuntu guest
        if: steps.kvm.outputs.available == 'true'
        run: sudo bash scripts/smoke-test-kvm-host.sh

      - name: Exercise the real host-agent provider against KVM
        if: steps.kvm.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          qemu_gid="$(getent group libvirt-qemu | cut -d: -f3)"
          libvirt_gid="$(stat -c %g /var/run/libvirt/libvirt-sock)"
          echo "Running provider test as the unprivileged runner UID with libvirt GID $libvirt_gid and QEMU GID $qemu_gid."
          sudo -u runner -g "$(id -gn runner)" -G "$libvirt_gid,$qemu_gid" \
            env BHAI_QEMU_GID="$qemu_gid" \
            node --experimental-strip-types scripts/smoke-test-host-agent-kvm.mjs

      - name: Report that real guest verification was unavailable
        if: steps.kvm.outputs.available != 'true'
        run: |
          echo "No live guest result: this runner lacks exposed KVM hardware virtualization."
          echo "The mocked lifecycle tests do not count as a real VM boot."
